backend:
  name: git-gateway
  branch: lab4-astro-cms
  
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "cookies"
    label: "Cookies"
    files:
      - file: "src/data/cookies.ts"
        label: "Weekly Cookies"
        name: "weekly"
        fields:
          - label: "Weekly Cookies"
            name: "weekly"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Short Title", name: "shortTitle", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Image", name: "img", widget: "string" }